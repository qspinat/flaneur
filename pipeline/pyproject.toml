[project]
name = "flaneur"
version = "0.1.0"
description = "Pipeline Flâneur : récolte, lecture, placement et export des photos d'archive de Paris"
authors = [
    { name = "Quentin Spinat", email = "qs-dev@tuta.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "kornia>=0.9.0",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pycolmap>=4.2.1",
    "pyproj>=3.8.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "torch>=2.15.0",
    "transformers>=5.0",
    "typer>=0.27.3",
]

[project.scripts]
flaneur = "flaneur.cli:app"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
